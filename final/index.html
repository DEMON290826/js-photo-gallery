<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accessible Interactive Photo Gallery</title>
  <style>
    :root {
      --ink: #1b1f29;
      --muted: #4d5566;
      --line: #b9c2d4;
      --accent: #1f5fbf;
      --paper: #ffffff;
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #eef1f7;
      color: var(--ink);
      margin: 0;
      padding: 40px 16px 72px;
      line-height: 1.5;
    }
    header {
      max-width: 960px;
      margin: 0 auto 32px;
      text-align: center;
    }
    h1 {
      font-size: 1.75rem;
      margin: 0 0 12px;
    }
    header p {
      color: var(--muted);
      margin: 0;
    }
    #image {
      max-width: 960px;
      min-height: 360px;
      margin: 0 auto 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      border: 3px dashed var(--line);
      border-radius: 18px;
      background-color: var(--paper);
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
      color: var(--muted);
      font-size: 1.15rem;
      text-align: center;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 20px;
      max-width: 960px;
      margin: 0 auto;
      padding: 0;
      list-style: none;
    }
    figure {
      margin: 0;
      background: var(--paper);
      border-radius: 14px;
      padding: 10px;
      border: 3px solid transparent;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    figure:hover,
    figure:focus-within {
      transform: translateY(-4px);
      border-color: var(--accent);
    }
    figure img {
      display: block;
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer;
    }
    figure img:focus-visible {
      outline: 4px solid var(--accent);
      outline-offset: 3px;
    }
    figcaption {
      font-size: 0.92rem;
      color: var(--muted);
      padding-top: 8px;
    }
    footer {
      max-width: 960px;
      margin: 32px auto 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body onload="addTabIndex()">
  <header>
    <h1>Accessible Interactive Photo Gallery</h1>
    <p>Hover over a picture with the mouse, or tab to it with the keyboard, to preview it here.</p>
  </header>

  <div id="image" role="region" aria-live="polite">Hover over an image below to display here.</div>

  <ul class="gallery">
    <li>
      <figure>
        <img src="https://picsum.photos/id/1015/500/360" alt="A river winding through a green mountain valley"
          onmouseover="upDate(this)" onmouseout="undo()" onfocus="upDate(this)" onblur="undo()">
        <figcaption>Valley river</figcaption>
      </figure>
    </li>
    <li>
      <figure>
        <img src="https://picsum.photos/id/1025/500/360" alt="A small dog wrapped in a blanket"
          onmouseover="upDate(this)" onmouseout="undo()" onfocus="upDate(this)" onblur="undo()">
        <figcaption>Sleepy dog</figcaption>
      </figure>
    </li>
    <li>
      <figure>
        <img src="https://picsum.photos/id/1039/500/360" alt="A waterfall dropping into a rocky pool"
          onmouseover="upDate(this)" onmouseout="undo()" onfocus="upDate(this)" onblur="undo()">
        <figcaption>Waterfall</figcaption>
      </figure>
    </li>
    <li>
      <figure>
        <img src="https://picsum.photos/id/1043/500/360" alt="City buildings seen from a tall viewpoint"
          onmouseover="upDate(this)" onmouseout="undo()" onfocus="upDate(this)" onblur="undo()">
        <figcaption>City view</figcaption>
      </figure>
    </li>
    <li>
      <figure>
        <img src="https://picsum.photos/id/1069/500/360" alt="A white boat floating on calm blue water"
          onmouseover="upDate(this)" onmouseout="undo()" onfocus="upDate(this)" onblur="undo()">
        <figcaption>Boat at sea</figcaption>
      </figure>
    </li>
    <li>
      <figure>
        <img src="https://picsum.photos/id/1080/500/360" alt="Bright red strawberries piled in a basket"
          onmouseover="upDate(this)" onmouseout="undo()" onfocus="upDate(this)" onblur="undo()">
        <figcaption>Strawberries</figcaption>
      </figure>
    </li>
  </ul>

  <footer>
    <p>Keyboard tip: press Tab to move through the pictures, then use the arrow keys to keep exploring.</p>
  </footer>

  <script>
    function upDate(previewPic) {
      var imageDiv = document.getElementById("image");
      imageDiv.innerHTML = previewPic.alt;
      imageDiv.style.backgroundImage = "url('" + previewPic.src + "')";
    }

    function undo() {
      var imageDiv = document.getElementById("image");
      imageDiv.innerHTML = "Hover over an image below to display here.";
      imageDiv.style.backgroundImage = "url('')";
    }

    function addTabIndex() {
      console.log("addTabIndex has been called; adding tabindex to every gallery image.");
      var images = document.querySelectorAll(".gallery img");
      for (var i = 0; i < images.length; i++) {
        images[i].setAttribute("tabindex", "0");
        console.log("tabindex added to image " + (i + 1));
      }
    }
  </script>
</body>
</html>
